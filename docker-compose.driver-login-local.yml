services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DRIVER_LOGIN_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DRIVER_LOGIN_POSTGRES_PASSWORD:?set DRIVER_LOGIN_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DRIVER_LOGIN_POSTGRES_DB:-uberfoods_driver_login}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - driver_login_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: uberfoods-driver-login-runtime:local
    build:
      context: .
      dockerfile: backend/Dockerfile.driver-login-runtime
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${DRIVER_LOGIN_POSTGRES_USER:-postgres}:${DRIVER_LOGIN_POSTGRES_PASSWORD}@postgres:5432/${DRIVER_LOGIN_POSTGRES_DB:-uberfoods_driver_login}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${DRIVER_LOGIN_JWT_SECRET:?set DRIVER_LOGIN_JWT_SECRET}
      JWT_REFRESH_SECRET: ${DRIVER_LOGIN_JWT_REFRESH_SECRET:?set DRIVER_LOGIN_JWT_REFRESH_SECRET}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:?set SEED_CUSTOMER_PASSWORD}
      SEED_RESTAURANT_PASSWORD: ${SEED_RESTAURANT_PASSWORD:?set SEED_RESTAURANT_PASSWORD}
      SEED_DRIVER_PASSWORD: ${SEED_DRIVER_PASSWORD:?set SEED_DRIVER_PASSWORD}
    ports:
      - "127.0.0.1::3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  driver_login_postgres:
